name: Build sprites
on:
  push:
    branches: [ gh-pages ]
    paths: [ svgs/** ]
  pull_request:
    branches: [ gh-pages ]
    paths: [ svgs/** ]
jobs:
  create-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkou️t
        uses: actions/checkout@v4.1.0
        
      - name: Setup node
        uses: actions/setup-node@v3.8.1
        with:
          node-version: 18

      - name: Build
        run: |
          npm ci
          npm run build_sprite

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: gh-pages
          target-folder: sprites
          folder: /home/runner/work/osm-liberty/osm-liberty/sprites
          git-config-email: <>
          commit-message: Build sprites
